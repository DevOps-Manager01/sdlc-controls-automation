name: SDLC Controls Monitoring

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}    # allows manual "Run workflow" button too
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-controls:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect evidence from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python collectors/github_collector.py

      - name: Evaluate controls
        run: python evaluators/evaluate_controls.py

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
